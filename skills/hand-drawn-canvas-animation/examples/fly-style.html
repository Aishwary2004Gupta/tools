<!doctype html>
<meta charset="utf-8">
<title>fly-style: hand-drawn canvas kit</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,720px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
  #info{min-width:260px}
  label{display:flex;gap:4px;align-items:center}
</style>
<canvas id="c" width="1080" height="1080"></canvas>
<div class="bar">
  <button id="play">play</button>
  <button id="snd">sound: off</button>
  <input id="scrub" type="range" min="0" max="0" value="0">
  <span id="info"></span>
</div>
<div class="bar">
  <label><input id="boil" type="checkbox"> boil on 3s</label>
  <button id="exp">export PNG frames</button>
  <button id="wav">export score.wav</button>
  <span id="msg"></span>
</div>
<script>
// ============================================================
// fly-style: a Canvas 2D "hand-drawn animation" kit.
// Everything is drawn procedurally; no images, no libraries.
// Cadence: drawn at 12 fps ("on twos"), packed to 24 fps video.
// Textures are seeded, so nothing boils unless you ask for it.
// ============================================================
const W=1080,H=1080,FPS_DRAW=12,FPS_OUT=24,DUR=9.5;
const NDRAW=Math.round(DUR*FPS_DRAW);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const octx=off.getContext('2d');
const off2=document.createElement('canvas');off2.width=W;off2.height=H;const o2ctx=off2.getContext('2d');
let BOIL=false;

// ---------- math ----------
function rng(seed){let a=(seed*1000003)>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,easeOut=t=>1-Math.pow(1-t,3);
const sm=(a,b,t,e=easeIO)=>e(clamp((t-a)/(b-a),0,1));
const TAU=Math.PI*2;
function ellPts(cx,cy,rx,ry,rot=0,n=44){const p=[];for(let i=0;i<n;i++){const a=i/n*TAU,x=rx*Math.cos(a),y=ry*Math.sin(a);p.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)])}return p}
function ellPath(cx,cy,rx,ry,rot=0){const p=new Path2D();p.ellipse(cx,cy,rx,ry,rot,0,TAU);return p}
function circPath(cx,cy,r){return ellPath(cx,cy,r,r)}
function rectPath(x,y,w,h){const p=new Path2D();p.rect(x,y,w,h);return p}

// ---------- style kit ----------
// wobbly stroke: polyline with seeded jitter = "drawn by hand"
function wob(c,pts,amp,seed,close=false){const r=rng(seed);c.beginPath();pts.forEach((p,i)=>{const x=p[0]+(r()-.5)*amp,y=p[1]+(r()-.5)*amp;i?c.lineTo(x,y):c.moveTo(x,y)});if(close)c.closePath();c.stroke()}
// hatch: short parallel strokes clipped to a path. box = [x,y,w,h] in the same coords as path
function hatch(c,path,o){const {angle=.9,gap=7,len=14,jitter=6,color='#000',alpha=.35,width=1.2,seed=1,box}=o;const r=rng(seed);
  c.save();c.clip(path);c.strokeStyle=color;c.globalAlpha=alpha;c.lineWidth=width;c.lineCap='round';
  const [bx,by,bw,bh]=box,cx=bx+bw/2,cy=by+bh/2,R=Math.hypot(bw,bh)/2,ca=Math.cos(angle),sa=Math.sin(angle);
  c.beginPath();
  for(let v=-R;v<=R;v+=gap){for(let u=-R;u<=R;u+=len*1.7){const uu=u+(r()-.5)*jitter*2,L=len*(.6+r()*.8);
    const x0=cx+ca*uu-sa*v+(r()-.5)*jitter*.6,y0=cy+sa*uu+ca*v+(r()-.5)*jitter*.6;c.moveTo(x0,y0);c.lineTo(x0+ca*L,y0+sa*L)}}
  c.stroke();c.restore()}
// grain: speckle dots clipped to a path
function grain(c,path,box,n,color,alpha,seed,size=1.8){const r=rng(seed);c.save();c.clip(path);c.fillStyle=color;c.globalAlpha=alpha;
  for(let i=0;i<n;i++){c.fillRect(box[0]+r()*box[2],box[1]+r()*box[3],size*(.4+r()),size*(.4+r()))}c.restore()}
// scribble: misregistered colour copies of an outline (the "riso print" look)
function scribble(c,path,cx,cy,o={}){const {colors=['#ff2bd6','#28f0e0','#ffe22b','#5cff5c'],amp=5,alpha=.55,width=1.1,seed=3}=o;const r=rng(seed);
  c.save();c.globalAlpha=alpha;c.lineWidth=width;
  for(const col of colors){c.strokeStyle=col;c.save();c.translate(cx+(r()-.5)*amp*2,cy+(r()-.5)*amp*2);c.rotate((r()-.5)*.08);c.scale(1+(r()-.5)*.08,1+(r()-.5)*.08);c.translate(-cx,-cy);c.stroke(path);c.restore()}
  c.restore()}
function cross(c,x,y,s){c.beginPath();c.moveTo(x-s,y);c.lineTo(x+s,y);c.moveTo(x,y-s);c.lineTo(x,y+s);c.stroke()}
// construction: thin blueprint guide lines with ticks, a circle and crosses
function construction(c,cx,cy,R,seed,color='rgba(70,100,255,.6)',alpha=1){const r=rng(seed);c.save();c.globalAlpha=alpha;c.strokeStyle=color;c.lineWidth=.9;
  for(let i=0;i<3;i++){const a=r()*Math.PI,L=R*(1.3+r()*1.2);c.beginPath();c.moveTo(cx-Math.cos(a)*L,cy-Math.sin(a)*L);c.lineTo(cx+Math.cos(a)*L,cy+Math.sin(a)*L);c.stroke();
    for(let k=-3;k<=3;k++){const u=k*L/4,x=cx+Math.cos(a)*u,y=cy+Math.sin(a)*u;c.beginPath();c.moveTo(x-Math.sin(a)*5,y+Math.cos(a)*5);c.lineTo(x+Math.sin(a)*5,y-Math.cos(a)*5);c.stroke()}}
  c.beginPath();c.arc(cx,cy,R*1.12,0,TAU);c.stroke();
  for(let i=0;i<5;i++)cross(c,cx+(r()-.5)*R*3,cy+(r()-.5)*R*3,6);
  c.restore()}
// hex lattice helpers (pointy-top)
function hexPath(x,y,s){const p=new Path2D();for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;i?p.lineTo(x+s*Math.cos(a),y+s*Math.sin(a)):p.moveTo(x+s*Math.cos(a),y+s*Math.sin(a))}p.closePath();return p}
function hexCells(box,s,fn){const w=Math.sqrt(3)*s,h=1.5*s;const [bx,by,bw,bh]=box;let row=0;for(let y=by-s;y<by+bh+s;y+=h,row++){const o=(row%2)?w/2:0;for(let x=bx-w+o;x<bx+bw+w;x+=w)fn(x,y)}}
function hexLattice(c,box,s,color,alpha,width=.8){c.save();c.strokeStyle=color;c.globalAlpha=alpha;c.lineWidth=width;hexCells(box,s,(x,y)=>c.stroke(hexPath(x,y,s)));c.restore()}
// aster: a nucleus with radiating rays
function aster(c,x,y,r,n,color,seed,g=1){const rr=rng(seed);c.save();c.strokeStyle=color;c.lineWidth=1.4;c.globalAlpha=.9;
  for(let i=0;i<n;i++){const a=i/n*TAU+(rr()-.5)*.3,r0=r*1.6,r1=r*(2.6+rr()*1.6)*g;c.beginPath();c.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);c.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);c.stroke()}
  c.fillStyle='#0b0d1f';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.strokeStyle='#e6ebff';c.lineWidth=1.6;c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(x+r*.2,y-r*.2,r*.35,0,TAU);c.fill();c.restore()}
// speed lines behind a moving thing. dir = heading angle (radians)
function speedLines(c,x,y,dir,seed,n=7,alpha=.6,color='#1e1630'){const r=rng(seed);c.save();c.strokeStyle=color;c.globalAlpha=alpha;c.lineCap='round';
  for(let i=0;i<n;i++){const side=(r()-.5)*70,back=30+r()*40,L=60+r()*120;const px=-Math.sin(dir),py=Math.cos(dir);const x0=x-Math.cos(dir)*back+px*side,y0=y-Math.sin(dir)*back+py*side;
    c.lineWidth=.8+r()*1.8;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0-Math.cos(dir)*L,y0-Math.sin(dir)*L);c.stroke()}c.restore()}
// rainbow loops trailing behind (the coloured "wake" seen around the flying fly)
function loops(c,x,y,dir,seed,alpha=.6){const r=rng(seed);const cols=['#ff2bd6','#28f0e0','#ffe22b','#5cff5c','#7b6bff'];c.save();c.translate(x,y);c.rotate(dir);c.globalAlpha=alpha;c.lineWidth=1.2;
  cols.forEach((col,k)=>{c.strokeStyle=col;c.beginPath();const A=14+r()*16,w=.12+r()*.1,ph=r()*TAU;for(let u=0;u<=220;u+=4){const yy=Math.sin(u*w+ph)*A+(k-2)*6,xx=-u-Math.cos(u*w*1.7+ph)*8;u?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke()});c.restore()}

// ---------- the fly (local coords, heading up = -y) ----------
const FLY={head:ellPath(0,-40,20,18),eyeL:ellPath(-19,-44,13,15,-.3),eyeR:ellPath(19,-44,13,15,.3),thorax:ellPath(0,0,26,30),abd:ellPath(0,54,27,46)};
function wingGeom(side,ang){const px=side*10,py=-8,dx=side*Math.sin(ang),dy=Math.cos(ang),cx=px+dx*58,cy=py+dy*58;return{cx,cy,rot:Math.atan2(dy,dx),path:ellPath(cx,cy,60,20,Math.atan2(dy,dx))}}
function compoundEye(c,mode,path,side,seed){c.save();c.clip(path);const box=[side*19-14,-60,28,32];
  if(mode==='ink'){c.fillStyle='#b81c27';c.fill(path);hexCells(box,3.4,(x,y)=>{const d=Math.hypot(x-side*13,y+50);const l=clamp(1-d/26,0,1);c.fillStyle=`rgb(${Math.round(lerp(140,255,l))},${Math.round(lerp(16,95,l))},${Math.round(lerp(28,95,l))})`;c.fill(hexPath(x,y,3.4));c.strokeStyle='rgba(60,5,12,.55)';c.lineWidth=.6;c.stroke(hexPath(x,y,3.4))});
    c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(side*14,-51,2.6,0,TAU);c.fill()}
  else{c.strokeStyle='#cfd6ff';c.lineWidth=.7;c.globalAlpha=.75;hexCells(box,3.4,(x,y)=>c.stroke(hexPath(x,y,3.4)));c.globalAlpha=1;c.fillStyle='#fff';c.beginPath();c.arc(side*14,-51,2.4,0,TAU);c.fill()}
  c.restore()}
// pose: {wing: angle from body axis, flap: 0..1 blur, legs: 0..1 tuck, walk: phase}
function drawFly(c,mode,pose,seed){const r=rng(seed);const ink=mode==='ink';const line=ink?'#1e1630':'#e8ecff';const lw=ink?2.2:2.4;
  c.save();c.lineJoin='round';c.lineCap='round';
  // legs
  for(let i=0;i<3;i++)for(const s of[-1,1]){const y0=-14+i*14,tuck=pose.legs;const ph=Math.sin(pose.walk*TAU+i*2.1+s)*6*(1-tuck);
    const pts=[[s*22,y0],[s*(40-tuck*10),y0-12+ph+i*4],[s*(60-tuck*22),y0+2+ph+i*8],[s*(70-tuck*30),y0+26+ph+i*10]];
    c.strokeStyle=line;c.lineWidth=ink?2:1.8;c.globalAlpha=ink?.95:.9;wob(c,pts,1.5,seed+11+i*3+s)}
  // wings (drawn first so body overlaps); flap = draw 3 ghost copies
  const ghosts=pose.flap>0?[-1,0,1]:[0];
  for(const s of[-1,1])for(const g of ghosts){const wg=wingGeom(s,pose.wing+g*.22*pose.flap);
    if(ink){c.fillStyle=`rgba(225,232,255,${.34/ghosts.length+.06})`;c.fill(wg.path);c.strokeStyle='rgba(40,30,60,.55)';c.lineWidth=1.2;wob(c,ellPts(wg.cx,wg.cy,60,20,wg.rot),1.2,seed+21+s+g,true);
      // veins
      c.strokeStyle='rgba(40,30,60,.5)';c.lineWidth=.9;for(let k=-1;k<=1;k++){c.beginPath();c.moveTo(wg.cx-Math.cos(wg.rot)*52,wg.cy-Math.sin(wg.rot)*52);const ex=wg.cx+Math.cos(wg.rot)*55-Math.sin(wg.rot)*k*13,ey=wg.cy+Math.sin(wg.rot)*55+Math.cos(wg.rot)*k*13;c.quadraticCurveTo((wg.cx+ex)/2-Math.sin(wg.rot)*k*10,(wg.cy+ey)/2+Math.cos(wg.rot)*k*10,ex,ey);c.stroke()}}
    else{c.strokeStyle='#cfd6ff';c.lineWidth=1.4;c.globalAlpha=.8;wob(c,ellPts(wg.cx,wg.cy,60,20,wg.rot),1.2,seed+21+s+g,true);c.globalAlpha=1}}
  // body parts: fill (ink) + hatch + outline
  const parts=[['abd','#c99a5a',[-30,6,60,96]],['thorax','#b8864e',[-28,-32,56,64]],['head','#c9a063',[-22,-60,44,40]]];
  for(const [k,col,box] of parts){const p=FLY[k];
    if(ink){c.fillStyle=col;c.globalAlpha=1;c.fill(p);
      if(k==='abd'){c.save();c.clip(p);c.strokeStyle='#3b2412';c.lineWidth=7;c.globalAlpha=.9;for(let i=0;i<5;i++){const y=26+i*16;c.beginPath();c.moveTo(-30,y-3);c.quadraticCurveTo(0,y+6,30,y-3);c.stroke()}c.restore()}
      hatch(c,p,{angle:1.2,gap:4.5,len:9,jitter:3,color:'#3a2214',alpha:.35,width:1,seed:seed+40,box});
      grain(c,p,box,160,'#2b1608',.35,seed+50,1.4);}
    c.strokeStyle=line;c.lineWidth=lw;c.globalAlpha=1;wob(c,ellPts(...pathArgs(k)),1.8,seed+60+k.length,true)}
  compoundEye(c,mode,FLY.eyeL,-1,seed);compoundEye(c,mode,FLY.eyeR,1,seed);
  c.strokeStyle=line;c.lineWidth=1.6;wob(c,ellPts(-19,-44,13,15,-.3),1.2,seed+70,true);wob(c,ellPts(19,-44,13,15,.3),1.2,seed+71,true);
  // antennae
  c.lineWidth=1.4;for(const s of[-1,1]){wob(c,[[s*6,-56],[s*12,-70],[s*20,-74]],1,seed+80+s);c.beginPath();c.arc(s*20,-74,2.2,0,TAU);c.stroke()}
  if(ink){scribble(c,FLY.thorax,0,0,{seed:seed+90,amp:5,alpha:.5});scribble(c,FLY.abd,0,54,{seed:seed+91,amp:6,alpha:.5})}
  c.restore()}
function pathArgs(k){return{head:[0,-40,20,18],thorax:[0,0,26,30],abd:[0,54,27,46]}[k]}

// ---------- camera ----------
function cam(c,x,y,zoom,rot=0){c.setTransform(1,0,0,1,0,0);c.translate(W/2,H/2);c.scale(zoom,zoom);c.rotate(rot);c.translate(-x,-y)}

// ---------- scene 0: fly on a peach ----------
function scenePeach(c,t,mode,seed=1){const ink=mode==='ink';
  c.setTransform(1,0,0,1,0,0);c.fillStyle=ink?'#f3e6cf':'#0b0d1f';c.fillRect(0,0,W,H);
  if(ink){c.save();c.translate(W/2,H/2);c.rotate(-Math.PI/4);c.fillStyle='rgba(255,238,200,.65)';for(let i=-6;i<=6;i++)c.fillRect(-1200,i*160-40,2400,80);c.restore()}
  else{grain(c,rectPath(0,0,W,H),[0,0,W,H],400,'#ffffff',.5,seed+5,1.6)}
  cam(c,540,520,lerp(1.15,1.3,sm(0,2.4,t)));
  const peach=circPath(560,980,700),pbox=[-140,280,1400,1400];
  if(ink){c.fillStyle='#e79256';c.fill(peach);
    c.save();c.clip(peach);
    hatch(c,circPath(300,560,420),{angle:.8,gap:6,len:16,jitter:6,color:'#fff1d6',alpha:.6,width:1.4,seed:seed+2,box:[-120,140,840,840]});
    hatch(c,circPath(820,1150,620),{angle:-.6,gap:5,len:18,jitter:5,color:'#c8473f',alpha:.38,width:1.2,seed:seed+3,box:[200,530,1240,1240]});
    hatch(c,circPath(860,1200,480),{angle:.9,gap:6,len:20,jitter:5,color:'#8e2a30',alpha:.35,width:1.1,seed:seed+4,box:[380,720,960,960]});
    c.restore();
    grain(c,peach,pbox,7000,'#7a2f16',.35,seed+6,2);
    c.strokeStyle='#2a1a2e';c.lineWidth=3;c.globalAlpha=.85;wob(c,ellPts(560,980,700,700,0,120),2.5,seed+7,true);c.globalAlpha=1;
    // dew drop
    const d=circPath(215,690,15);c.fillStyle='rgba(255,244,225,.55)';c.fill(d);c.strokeStyle='#2a1a2e';c.lineWidth=2;c.stroke(d);c.fillStyle='rgba(255,255,255,.9)';c.fill(ellPath(219,694,6,4));c.fill(circPath(209,684,2));
  } else {c.strokeStyle='#cfd6ff';c.lineWidth=1.2;c.globalAlpha=.7;wob(c,ellPts(560,980,700,700,0,120),1.5,seed+7,true);c.globalAlpha=1}
  // the fly, big, sitting; idle twitch quantised to the 12 fps grid
  const f=Math.floor(t*FPS_DRAW),tw=rng(seed+f);const twitch=(f%9===0)?.18:0;
  c.save();c.translate(520,430);c.rotate(-.17);c.scale(1.9,1.9);
  if(ink){construction(c,0,10,120,seed+9,'rgba(70,100,255,.45)')}
  drawFly(c,mode,{wing:.55+twitch,flap:0,legs:0,walk:0},seed+(BOIL?f%3:0));
  c.restore();
  if(ink){c.strokeStyle='rgba(70,100,255,.5)';c.lineWidth=.9;cross(c,300,300,8);cross(c,760,640,8)}
}
// ink-blot transition: blueprint version of the scene grows out of the fly
function blot(c,t,drawInside){const p=sm(2.4,3.2,t,easeOut),R=lerp(0,1000,p);if(p<=0)return;
  drawInside(octx);
  const r=rng(77);const pts=[];for(let i=0;i<72;i++){const a=i/72*TAU;pts.push([540+20+Math.cos(a)*R*(1+(r()-.5)*.16),380+Math.sin(a)*R*(1+(r()-.5)*.16)])}
  c.setTransform(1,0,0,1,0,0);const path=new Path2D();pts.forEach((q,i)=>i?path.lineTo(q[0],q[1]):path.moveTo(q[0],q[1]));path.closePath();
  c.save();c.clip(path);c.drawImage(off,0,0);c.restore();
  // bristly fringe
  c.save();c.strokeStyle='#0b0d1f';c.lineWidth=1.6;c.globalAlpha=.9;const rr=rng(78);
  for(let i=0;i<420;i++){const a=rr()*TAU,rad=R*(1+(rr()-.5)*.14),L=10+rr()*38;const x=560+Math.cos(a)*rad,y=380+Math.sin(a)*rad;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);c.stroke()}
  c.restore()}

// ---------- scene 1: blueprint egg, cleavage, segmentation ----------
const DOUBLINGS=[1.1,1.4,1.7,2.0,2.3];
function sceneEgg(c,tau,seed=11){c.setTransform(1,0,0,1,0,0);c.fillStyle='#0b0d1f';c.fillRect(0,0,W,H);grain(c,rectPath(0,0,W,H),[0,0,W,H],500,'#ffffff',.45,seed,1.6);
  const cx=540,cy=560,rot=-.42,rx=205,ry=330;
  cam(c,540,540,1);
  // 0: a lone spark
  const s0=sm(0,.3,tau);aster(c,cx,cy,4,14,'#7fe7ff',seed+1,s0);
  // 1: construction
  construction(c,cx,cy,300,seed+2,'rgba(150,170,255,.7)',sm(.3,.7,tau));
  // 2: egg outline draws itself
  const pe=sm(.7,1.1,tau,easeOut);if(pe>0){c.save();c.strokeStyle='#e6ebff';c.lineWidth=3;const per=TAU*Math.max(rx,ry)*1.1;c.setLineDash([per*pe,per]);wob(c,ellPts(cx,cy,rx,ry,rot,140),1.5,seed+3,true);c.restore()}
  const egg=ellPath(cx,cy,rx,ry,rot);
  // hex lattice inside
  const pl=sm(1.0,1.4,tau);if(pl>0){c.save();c.clip(egg);hexLattice(c,[cx-360,cy-360,720,720],17,'#8d97c9',.38*pl,.9);c.restore()}
  // polar bodies (two pale balloons on stalks at the top pole)
  if(pe>.5){c.save();c.strokeStyle='#cfd6ff';c.lineWidth=2;const tx=cx+Math.sin(rot)*ry*.96,ty=cy-Math.cos(rot)*ry*.96;
    for(const [dx,dy,r0] of[[-70,-95,22],[-18,-118,19]]){c.beginPath();c.moveTo(tx,ty);c.lineTo(tx+dx,ty+dy);c.stroke();c.fillStyle='rgba(150,170,255,.6)';c.fill(ellPath(tx+dx,ty+dy-8,r0,r0*1.25,.4));}c.restore()}
  // nuclei doubling
  const k=DOUBLINGS.filter(d=>tau>=d).length;const n=Math.pow(2,k);const rr=rng(seed+4);const pts=[];
  for(let i=0;i<32;i++){let x,y;do{const u=(rr()-.5)*2,v=(rr()-.5)*2;x=u*rx*.85;y=v*ry*.85;if((x*x)/(rx*rx)+(y*y)/(ry*ry)<.72)break}while(true);pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)])}
  const fadeN=1-sm(2.4,2.8,tau);
  if(tau>=1.0&&fadeN>0){c.save();c.globalAlpha=fadeN;const last=k?DOUBLINGS[k-1]:1.0;const g=sm(last,last+.25,tau,easeOut);
    // spindle lines between sibling pairs right after a doubling
    if(k&&g<1){c.strokeStyle='rgba(127,231,255,.8)';c.lineWidth=1;for(let i=0;i<n;i+=2){c.beginPath();c.moveTo(pts[i][0],pts[i][1]);c.lineTo(pts[i+1][0],pts[i+1][1]);c.stroke()}}
    for(let i=0;i<n;i++)aster(c,pts[i][0],pts[i][1],k<3?7:5,12,'#7fe7ff',seed+10+i,.6+.4*g);c.restore()}
  // segmentation stripes
  const nb=tau>=2.4?Math.min(7,1+Math.floor((tau-2.4)/.11)):0;
  if(nb){c.save();c.clip(egg);c.translate(cx,cy);c.rotate(rot);for(let i=0;i<nb;i++){const y=-ry*.7+i*(ry*1.4/7);c.fillStyle='rgba(95,224,138,.85)';c.fillRect(-rx-20,y,rx*2+40,26);grain(c,rectPath(-rx-20,y,rx*2+40,26),[-rx-20,y,rx*2+40,26],260,'#ffffff',.55,seed+30+i,1.6)}c.restore();
    c.save();c.globalAlpha=.5;c.strokeStyle='#ffb3f0';c.lineWidth=1;c.stroke(ellPath(cx,cy,rx*1.06,ry*1.03,rot));c.restore()}
  // lineage tree, top right
  if(k){c.save();c.strokeStyle='#cfd6ff';c.fillStyle='#cfd6ff';c.lineWidth=1;const x0=930,y0=80;
    for(let d=0;d<=k;d++){const cnt=Math.pow(2,d),span=Math.min(220,cnt*14);for(let i=0;i<cnt;i++){const x=x0-span/2+(cnt===1?0:i*span/(cnt-1)),y=y0+d*22;c.beginPath();c.arc(x,y,2,0,TAU);c.fill();
      if(d<k){const cc=cnt*2,sp=Math.min(220,cc*14);for(const j of[2*i,2*i+1]){const x2=x0-sp/2+j*sp/(cc-1),y2=y0+(d+1)*22;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke()}}}}c.restore()}
}

// ---------- scene 2: flight over the kitchen floor ----------
function bez(p0,p1,p2,p3,t){const u=1-t;return[u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]}
const PATH=[[300,2000],[1300,1500],[500,700],[1900,450]];
function drawRoom(c,seed=21){c.fillStyle='#eef0e8';c.fillRect(-200,-200,2800,2800);
  for(let i=-1;i<22;i++)for(let j=-1;j<22;j++){if((i+j)%2){c.fillStyle='#a9c4c9';c.fillRect(i*120+8,j*120+8,104,104);grain(c,rectPath(i*120+8,j*120+8,104,104),[i*120+8,j*120+8,104,104],14,'#5e8a91',.35,seed+i*31+j,2)}}
  c.strokeStyle='rgba(40,50,80,.35)';c.lineWidth=1;for(let i=0;i<22;i++)for(let j=0;j<22;j++)cross(c,i*120,j*120,4);
  // table with wood grain
  c.fillStyle='#d9b078';c.fillRect(900,250,960,760);const r=rng(seed+3);c.strokeStyle='rgba(120,70,20,.35)';c.lineWidth=1.2;for(let i=0;i<40;i++){const y=260+r()*740;wob(c,[[910,y],[1200,y+(r()-.5)*20],[1500,y+(r()-.5)*20],[1850,y]],3,seed+40+i)}
  c.strokeStyle='#2a1a2e';c.lineWidth=3;wob(c,[[900,250],[1860,250],[1860,1010],[900,1010]],2.5,seed+4,true);
  // plate with rings + fruit
  const px=1380,py=650;c.fillStyle='#f4f1e6';c.fill(circPath(px,py,230));c.strokeStyle='#7fb3a8';c.lineWidth=5;c.stroke(circPath(px,py,215));c.strokeStyle='#2a1a2e';c.lineWidth=2.5;wob(c,ellPts(px,py,230,230,0,80),2,seed+5,true);
  c.strokeStyle='rgba(120,140,160,.6)';c.lineWidth=1;for(let k=1;k<6;k++)c.stroke(circPath(px,py,40*k));
  const orange=circPath(px-60,py-20,85);c.fillStyle='#f0923c';c.fill(orange);hatch(c,orange,{angle:1,gap:5,len:12,jitter:4,color:'#b8501e',alpha:.4,seed:seed+6,box:[px-150,py-110,180,180]});c.strokeStyle='#2a1a2e';c.lineWidth=2.5;wob(c,ellPts(px-60,py-20,85,85),2,seed+7,true);
  const gr=rng(seed+8);for(let i=0;i<9;i++){const gx=px+80+(gr()-.5)*90,gy=py+70+(gr()-.5)*70;const g=circPath(gx,gy,22);c.fillStyle='#7b4b9a';c.fill(g);c.strokeStyle='#2a1a2e';c.lineWidth=2;c.stroke(g);c.fillStyle='rgba(255,255,255,.5)';c.fill(circPath(gx-6,gy-7,5))}
}
function sceneFlight(c,tau,seed=21){const u=sm(0,2.2,tau,easeIO);const p=bez(...PATH,u),q=bez(...PATH,Math.min(1,u+.01));const dir=Math.atan2(q[1]-p[1],q[0]-p[0]);
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#eef0e8';c.fillRect(0,0,W,H);
  cam(c,p[0]+Math.cos(dir)*120,p[1]+Math.sin(dir)*120,1);
  drawRoom(c,seed);
  // shadow
  c.save();c.translate(p[0]+45,p[1]+70);c.rotate(dir+Math.PI/2);const sh=ellPath(0,0,40,90);hatch(c,sh,{angle:.4,gap:4,len:12,jitter:3,color:'#2a1a2e',alpha:.35,seed:seed+9,box:[-50,-100,100,200]});c.restore();
  const f=Math.floor(tau*FPS_DRAW);
  speedLines(c,p[0],p[1],dir,seed+f,9,.55);loops(c,p[0],p[1],dir,seed+3,.7);
  c.save();c.translate(p[0],p[1]);c.rotate(dir+Math.PI/2);drawFly(c,'ink',{wing:1.25,flap:1,legs:1,walk:0},seed+(BOIL?f%3:0));c.restore()}

// ---------- scene 3: what the fly sees (compound-eye mosaic) ----------
function sceneEye(c,tau,seed=31){const u=sm(0,.7,tau);
  // render the room once into an offscreen buffer
  o2ctx.setTransform(1,0,0,1,0,0);o2ctx.fillStyle='#eef0e8';o2ctx.fillRect(0,0,W,H);cam(o2ctx,1380,650,.8);drawRoom(o2ctx,21);
  const img=o2ctx.getImageData(0,0,W,H).data;const s=lerp(40,13,u);
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#0b0d1f';c.fillRect(0,0,W,H);
  c.save();c.clip(circPath(540,540,505));
  hexCells([0,0,W,H],s,(x,y)=>{const xi=clamp(Math.round(x),0,W-1),yi=clamp(Math.round(y),0,H-1),i=(yi*W+xi)*4;c.fillStyle=`rgb(${img[i]*.92|0},${img[i+1]*.92|0},${img[i+2]*.95|0})`;const hp=hexPath(x,y,s);c.fill(hp);c.strokeStyle='rgba(20,25,60,.55)';c.lineWidth=1;c.stroke(hp)});
  c.fillStyle='rgba(120,160,255,.10)';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(20,30,90,.5)';c.lineWidth=1;const r=rng(seed);for(let i=0;i<10;i++)cross(c,r()*W,r()*H,5);
  c.restore();
  c.strokeStyle='#e6ebff';c.lineWidth=3;wob(c,ellPts(540,540,505,505,0,120),2,seed+1,true)}

// ---------- timeline ----------
function drawFrame(i){const t=i/FPS_DRAW;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  let scene;
  if(t<3.2){scenePeach(ctx,t,'ink');blot(ctx,t,c=>scenePeach(c,t,'blueprint'));scene='peach'+(t>=2.4?' > blot':'')}
  else if(t<6.4){sceneEgg(ctx,t-3.2);scene='egg'}
  else if(t<8.6){sceneFlight(ctx,t-6.4);scene='flight'}
  else{sceneEye(ctx,t-8.6);scene='compound eye'}
  ctx.setTransform(1,0,0,1,0,0);return scene}

// ---------- score (Web Audio; same timeline drives the music) ----------
function buildScore(ac,t0,dest){const master=ac.createGain();master.gain.value=.6;master.connect(dest||ac.destination);
  const note=(f,t,d,type='triangle',g=.25)=>{const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(0,t0+t);e.gain.linearRampToValueAtTime(g,t0+t+.02);e.gain.exponentialRampToValueAtTime(.0008,t0+t+d);o.connect(e);e.connect(master);o.start(t0+t);o.stop(t0+t+d+.05)};
  const pent=[0,2,4,7,9],base=220,r=rng(7),hz=(o,s)=>base*Math.pow(2,o+pent[s]/12);
  for(let t=0;t<2.4;t+=.5)note(hz(0,Math.floor(r()*5)),t,.7,'triangle',.2);
  note(55,2.4,1.2,'sawtooth',.12);note(110,2.5,1.0,'sine',.15);
  DOUBLINGS.forEach((t,i)=>note(hz(1,i%5),3.2+t,.5,'sine',.22));
  for(let i=0;i<7;i++)note(hz(2,i%5),3.2+2.4+i*.11,.25,'triangle',.14);
  for(let t=6.4;t<8.6;t+=.125)note(hz(1,Math.floor(r()*5)),t,.14,'square',.05);
  for(let t=6.4;t<8.6;t+=.5)note(hz(0,0),t,.4,'sine',.12);
  note(hz(-1,0),8.6,1.0,'sine',.25);note(hz(0,2),8.7,.9,'sine',.15)}

// ---------- player / ui ----------
const scrub=document.getElementById('scrub'),info=document.getElementById('info'),msg=document.getElementById('msg');scrub.max=NDRAW-1;
let playing=false,start=0,cur=-1,sound=false,ac=null;
function show(i){if(i===cur)return;cur=i;const sc=drawFrame(i);scrub.value=i;info.textContent=`draw ${String(i).padStart(3,'0')}/${NDRAW}  t=${(i/FPS_DRAW).toFixed(2)}s  ${sc}`}
function loop(){if(!playing)return;const t=((performance.now()-start)/1000)%DUR;show(Math.floor(t*FPS_DRAW));requestAnimationFrame(loop)}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'pause':'play';if(playing){start=performance.now();if(sound){ac=ac||new AudioContext();ac.resume();buildScore(ac,ac.currentTime+.05)}loop()}};
document.getElementById('snd').onclick=e=>{sound=!sound;e.target.textContent='sound: '+(sound?'on':'off')};
scrub.oninput=()=>{playing=false;document.getElementById('play').textContent='play';show(+scrub.value)};
document.getElementById('boil').onchange=e=>{BOIL=e.target.checked;cur=-1;show(+scrub.value)};
// export: 12 fps PNGs into a folder you pick, then ffmpeg packs them to 24 fps
document.getElementById('exp').onclick=async()=>{if(!window.showDirectoryPicker){msg.textContent='File System Access API missing: use ?frame=N with a headless browser';return}
  const dir=await showDirectoryPicker({mode:'readwrite'});playing=false;
  for(let i=0;i<NDRAW;i++){cur=-1;show(i);const blob=await new Promise(res=>cv.toBlob(res,'image/png'));const fh=await dir.getFileHandle(String(i).padStart(4,'0')+'.png',{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();msg.textContent=`exported ${i+1}/${NDRAW}`}
  msg.textContent=`done. ffmpeg -framerate ${FPS_DRAW} -i %04d.png -r ${FPS_OUT} -pix_fmt yuv420p -crf 18 out.mp4`};
document.getElementById('wav').onclick=async()=>{const sr=48000,oac=new OfflineAudioContext(2,Math.ceil(sr*DUR),sr);buildScore(oac,0,oac.destination);const buf=await oac.startRendering();
  const n=buf.length,ch=2,out=new DataView(new ArrayBuffer(44+n*ch*2));const ws=(o,s)=>{for(let i=0;i<s.length;i++)out.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');out.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,ch,true);out.setUint32(24,sr,true);out.setUint32(28,sr*ch*2,true);out.setUint16(32,ch*2,true);out.setUint16(34,16,true);ws(36,'data');out.setUint32(40,n*ch*2,true);
  const L=buf.getChannelData(0),R=buf.getChannelData(1);let o=44;for(let i=0;i<n;i++){out.setInt16(o,clamp(L[i],-1,1)*32767,true);out.setInt16(o+2,clamp(R[i],-1,1)*32767,true);o+=4}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'audio/wav'}));a.download='score.wav';a.click();msg.textContent='score.wav: ffmpeg -i out.mp4 -i score.wav -c:v copy -c:a aac -shortest final.mp4'};
// headless use: ?frame=N draws one frame and stops
const qs=new URLSearchParams(location.search);
window.__drawFrame=i=>{cur=-1;show(i)};window.__NDRAW=NDRAW;
if(qs.has('bare')){document.body.style.cssText='margin:0;padding:0;background:#000';cv.style.cssText='width:1080px;height:1080px;display:block';document.querySelectorAll('.bar').forEach(b=>b.hidden=true)}
if(qs.has('frame'))show(+qs.get('frame'));else show(0);
</script>
